[build]
builder = "nixpacks"

[deploy]
# SERVICE_MODE controls which service this is:
#   curator  → runs Flask curator dashboard (ideal-compassion service)
#   pipeline → runs daily CA pipeline (paperse-pipeline service, cron job)
startCommand = "bash -c 'echo PORT=$PORT && echo SERVICE_MODE=$SERVICE_MODE && which python3 && python3 --version && python3 -c \"import flask; print(\\\"Flask:\\\",flask.__version__)\" && python3 pipelines/curator_health_test.py'"
