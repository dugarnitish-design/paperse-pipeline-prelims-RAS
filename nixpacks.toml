# nixpacks configuration.
# WeasyPrint (STEP 4 pdf_generator) needs native system libs. Railway's default
# nixpacks build installs Python only, so PDF generation crashed at runtime
# ("cannot load library 'libpango/libgobject/…'"). Install them via nixPkgs.
#
# nixpkgs attribute names (NOT apt names):
#   glib            → provides libglib-2.0 / libgobject-2.0 (use glib, not
#                     gobject-introspection, which is a dev/codegen tool and broke the build)
#   liberation_ttf  → base Latin fonts so WeasyPrint always has a fallback font
# Hindi (Devanagari) does NOT depend on a system font here — the PDF bundles
# Noto Sans Devanagari via @font-face from ./fonts (committed in the repo).

[phases.setup]
nixPkgs = [
  "python311",
  "pango",
  "cairo",
  "gdk-pixbuf",
  "glib",
  "harfbuzz",
  "fontconfig",
  "freetype",
  "liberation_ttf",
]

[phases.install]
cmds = [
  "pip install -r requirements.txt"
]

[start]
cmd = "python3 launch.py"
