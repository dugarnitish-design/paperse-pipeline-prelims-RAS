# nixpacks configuration.
# WeasyPrint (STEP 4 pdf_generator) needs native system libs (pango/cairo/
# gdk-pixbuf/harfbuzz/fontconfig/freetype + glib via gobject-introspection).
# Railway's default nixpacks build installs Python only, so PDF generation
# crashed at runtime ("cannot load library 'libpango/…'"). Install them here.
# noto-fonts ships Noto Sans Devanagari so the Hindi PDF renders on Railway.

[phases.setup]
nixPkgs = [
  "python311",
  "pango",
  "cairo",
  "gdk-pixbuf",
  "gobject-introspection",
  "harfbuzz",
  "fontconfig",
  "freetype",
  "noto-fonts",
]

[phases.install]
cmds = [
  "pip install -r requirements.txt"
]

[start]
cmd = "python3 launch.py"
